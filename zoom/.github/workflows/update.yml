name: Update repository

# Adds new Zoom versions (Zoom's latest plus releases found via Flathub/AUR),
# then rebuilds, signs and publishes the APT indices to GitHub Pages. The .deb
# files themselves stay on cdn.zoom.us; clients are sent there by mirrors.txt.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['versions.txt', 'versions-skipped.txt', 'stanzas/**', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: add
        name: Add new Zoom versions
        run: |
          # On failure still publish what could be added, the last step fails the run
          result=0
          touch "$RUNNER_TEMP/added"
          ADDED_FILE="$RUNNER_TEMP/added" scripts/add-new-versions.sh || result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.txt stanzas/
          if ! git diff --cached --quiet; then
            git commit -m "Add zoom $(sort -V "$RUNNER_TEMP/added" | paste -sd ' ')"
            git push
          elif [ "$(git log -1 --format=%ct)" -lt "$(date -d '50 days ago' +%s)" ]; then
            # GitHub disables scheduled workflows after 60 days without repository activity
            git commit --allow-empty -m "Keepalive: no new Zoom version for 50 days"
            git push
          else
            echo "Nothing new"
          fi

      - name: Import repository signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret REPO_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build indices
        run: scripts/build-index.sh public "${{ steps.pages.outputs.base_url }}/" "$KEY_ID"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Report problems with Zoom's latest version
        if: steps.add.outputs.result != '0'
        run: |
          case "${{ steps.add.outputs.result }}" in
            1) echo "::error::Zoom's latest version couldn't be verified or downloaded, see the 'Add new Zoom versions' step" ;;
            2) echo "::error::Zoom's latest version couldn't be determined (zoom.us unreachable?)" ;;
            *) echo "::error::Adding new Zoom versions failed, see the 'Add new Zoom versions' step" ;;
          esac
          exit 1
